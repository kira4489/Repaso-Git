name: Docker Kubernetes Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # DOCKER
      # -------------------------
      - name: Build Docker Image
        run: docker build -t proyecto-devops:latest .

      - name: Ejecutar contenedor
        run: docker run -d -p 5000:5000 proyecto-devops:latest

      # -------------------------
      # KUBECTL
      # -------------------------
      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # -------------------------
      # KIND
      # -------------------------
      - name: Install KIND
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/

      - name: Create Kubernetes Cluster
        run: kind create cluster

      # -------------------------
      # LOAD IMAGE INTO KIND
      # -------------------------
      - name: Load Docker image into KIND
        run: kind load docker-image proyecto-devops:latest

      # -------------------------
      # DEPLOY
      # -------------------------
      - name: Kubernetes Deployment
        run: kubectl apply -f deployment.yml

      - name: Kubernetes Service
        run: kubectl apply -f service.yml

      # -------------------------
      # WAIT PODS
      # -------------------------
      - name: Esperar pods listos
        run: kubectl wait --for=condition=ready pod -l app=proyecto-devops  --timeout=120s

      # -------------------------
      # DEBUG
      # -------------------------
      - name: Ver pods
        run: kubectl get pods -o wide

      - name: Describe pods
        run: kubectl describe pods

      - name: Ver logs
        run: kubectl logs -l app=proyecto-devops 